<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="eye_container">
            <div class="eye" id="left_eye">
                <div class="eyelid" id="left_eyelid"></div>
            </div>
            <div class="eye" id="right_eye">
                <div class="eyelid" id="right_eyelid"></div>
            </div>
        </div>
        <div class="mouth_container">
            <div class="mouth" id="mouth">
                <div class="lip" id="upper_lip"></div>
            </div>
        </div>
    </div>
    <div class="button_container">
        <button class="mouth_buttons" id="grin">😀</button>
        <button class="mouth_buttons" id="smile">😁</button>
        <button class="mouth_buttons" id="sad">😦</button>
        <button class="mouth_buttons" id="surprise">😮</button>

        <button class="mouth_buttons" id="happy">😊</button>
        <button class="mouth_buttons" id="wink">😜</button>
        <button class="mouth_buttons" id="frown">☹️</button>
        <button class="mouth_buttons" id="neutral">😐</button>
    </div>
    <script src="index.js"></script>
</body>
</html>
